<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер прочитаних книг</title>
    <!-- Підключення серифного шрифту Merriweather для заголовків -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Трекер прочитаних книг</h1>
        <nav>
            <ul>
                <li><a href="#add-book">➕ Додати книгу</a></li>
                <li><a href="#my-books">📚 Мої книги</a></li>
                <li><a href="#reading-stats">📊 Статистика</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="add-book">
            <h2>Додати книгу</h2>
            <form action="#" method="post">
                <div>
                    <label for="book-title">Назва книги:</label>
                    <input type="text" id="book-title" name="title" placeholder="Введіть назву..." required>
                </div>

                <div>
                    <label for="book-author">Автор:</label>
                    <input type="text" id="book-author" name="author" placeholder="Введіть ім'я автора..." pattern="[^0-9]+" required>
                </div>

                <div>
                    <label for="book-pages">Кількість сторінок:</label>
                    <input type="number" id="book-pages" name="pages" placeholder="Введіть кількість сторінок..." min="1" max="10000" required>
                </div>

                <div>
                    <label for="book-status">Статус:</label>
                    <select id="book-status" name="status">
                        <option value="not-reading">Не почато</option>
                        <option value="reading" selected>Читається</option>
                        <option value="finished">Прочитано</option>
                    </select>
                </div>

                <button type="submit">Додати книгу</button>
            </form>
        </section>

        <section id="my-books">
            <h2>Мої книги</h2>
            <div class="cards" id="books-list">
                <article class="book-card">
                    <h3>Назва книги</h3>
                    <p><strong>Автор:</strong> Ім'я автора</p>
                    <p><strong>Сторінок:</strong> 0</p>
                    <p><strong>Статус:</strong> Читається</p>
                    <div class="status-indicator reading"></div>
                </article>
            </div>
        </section>
    </main>

    <aside id="reading-stats">
        <h2>Статистика читання</h2>
        <p id="books-count">Усього книг: 0</p>
        <p id="finished-count">Прочитано: 0</p>
        <p id="reading-count">Читається: 0</p>
        <p id="not-reading-count">Не почато: 0</p>
    </aside>

    <footer>
        <p><strong>Автор сайту:</strong> Володимир Дзьобань</p>
    </footer>
</body>
</html>
